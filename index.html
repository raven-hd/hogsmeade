<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>мастерская доставок</title>
<script>
(function () {
    var folders = { peach: 'rich-peach/', raven: 'under-the-raven-wing/', cafeteria: 'cafeteria/' };
    var shop = 'raven';
    try {
        var saved = localStorage.getItem('delivery.v2.last-shop');
        if (Object.hasOwn(folders, saved)) shop = saved;
    } catch (_) {}
    location.replace(folders[shop]);
})();
</script>
</head>
<body><p><a href="under-the-raven-wing/">открыть мастерскую доставок</a></p></body>
</html>
