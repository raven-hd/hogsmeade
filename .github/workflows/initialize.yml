name: Initialize Hogsmeade shops
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/initialize.yml']
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Restore approved catalogs, code and verified images
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('migration/bootstrap.py')
          p.write_text(p.read_text().replace("safe=':/%?=&'", "safe=':/%?=&@'"))
          PYTHON
          python3 migration/bootstrap.py
      - name: Commit the prepared shop project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore .nojekyll README.md index.html rich-peach under-the-raven-wing cafeteria shared migration
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Hogsmeade shops with current catalogs and verified product images'
            git push origin HEAD:main
          fi
